services:
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: invoice-processor-backend
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-invoice_processor}
      DB_USERNAME: ${MYSQL_USER:-invoice_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-change_me}
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - invoice-network

  frontend:
    image: node:22-alpine
    container_name: invoice-processor-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    networks:
      - invoice-network

  db:
    image: mysql:8.4
    container_name: invoice-processor-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-invoice_processor}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me}
      MYSQL_USER: ${MYSQL_USER:-invoice_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - invoice-network

networks:
  invoice-network:
    driver: bridge

volumes:
  mysql_data:
  frontend_node_modules:
